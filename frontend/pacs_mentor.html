<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACS Continuity Mentor - Emergency Terminal</title>
    <style>
        :root {
            --bg: #050505;
            --crt-green: #33ff33;
            --alert-red: #ff3333;
            --warn-yellow: #ffff33;
            --border: #226622;
        }
        body {
            background-color: var(--bg);
            color: var(--crt-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            text-transform: uppercase;
        }
        .terminal {
            border: 2px solid var(--border);
            padding: 20px;
            box-shadow: inset 0 0 10px #002200;
            min-height: 80vh;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .log-area {
            height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border);
            padding: 10px;
            margin-bottom: 20px;
            background: #001100;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background: #000;
            color: var(--crt-green);
            border: 1px solid var(--crt-green);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover {
            background: var(--crt-green);
            color: #000;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            <h1>PACS Continuity Mentor v1.0</h1>
            <p>CRISIS MODE: VENDOR LOCKOUT / INFRASTRUCTURE FAILURE</p>
        </div>

        <div class="status-bar">
            <span>MODE: <span id="mode-text">LOCKED</span></span>
            <span>AUTH: <span id="auth-status" style="color:var(--alert-red)">UNVERIFIED</span></span>
        </div>

        <div id="log" class="log-area">
            > SYSTEM STANDBY. UPLOAD THE EMERGENCY OPERATIONAL CONTINUITY DIRECTIVE IMAGE TO BEGIN.<br>
        </div>

        <div class="controls">
            <input type="file" id="auth-upload" class="hidden" accept="image/*">
            <button onclick="document.getElementById('auth-upload').click()">UPLOAD AUTH IMAGE</button>
            <button onclick="startDiscovery()">PASSIVE DISCOVERY</button>
            <button onclick="startRecovery()">RECOVERY WIZARD</button>
            <button onclick="exportReport()">EXPORT AUDIT LOG</button>
        </div>
    </div>

    <script>
        async function startDiscovery() {
            const log = document.getElementById('log');
            log.innerHTML += "> INITIALIZING PASSIVE SNIFFER...<br>";
            const resp = await fetch('/api/pacs/discover', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({interface: 'eth0'})
            });
            const data = await resp.json();
            log.innerHTML += `> DISCOVERY COMPLETE. FOUND ${data.topology.length} NODES.<br>`;
            data.topology.forEach(n => {
                log.innerHTML += `>> ${n.ip} | ${n.vendor} | ${n.mac}<br>`;
            });
        }

        async function startRecovery() {
            const log = document.getElementById('log');
            const resp = await fetch('/api/pacs/walkthrough?target=LINUX_VM');
            const data = await resp.json();
            if (data.steps.includes("Unauthorized")) {
                log.innerHTML += "<span style='color:var(--alert-red)'>> ERROR: AUTHENTICATION REQUIRED.</span><br>";
            } else {
                log.innerHTML += "> RECOVERY STEPS RETRIEVED:<br>";
                data.steps.forEach(s => log.innerHTML += `>> ${s}<br>`);
            }
        }

        async function exportReport() {
            const log = document.getElementById('log');
            const resp = await fetch('/api/pacs/report');
            const data = await resp.json();
            log.innerHTML += "> GENERATING PAYLOAD...<br>";
            console.log(data);
            alert("Audit log generated in console (JSON). Proceed to export to ServiceNow.");
        }
    </script>
</body>
</html>
